<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小车避障练习 · 未来学习场</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f6f4; color: #172822; font: 16px/1.65 system-ui, sans-serif; }
    main { width: min(100% - 2rem, 44rem); margin: clamp(2rem, 7vw, 5rem) auto; padding: clamp(1.25rem, 5vw, 3rem); background: white; border: 1px solid #cfddd6; border-radius: 1.25rem; }
    h1 { line-height: 1.2; margin: 1rem 0 .5rem; }
    h2 { font-size: 1.5rem; margin: .25rem 0 1rem; }
    a { color: #15563e; }
    #progress { color: #3e6253; margin-bottom: 0; }
    #rule, #feedback { padding: .85rem 1rem; border-radius: .65rem; background: #edf5f0; }
    #feedback:empty { display: none; }
    fieldset { border: 0; padding: 0; margin: 1rem 0; }
    legend { font-weight: 650; margin-bottom: .5rem; }
    label { display: block; padding: .45rem 0; }
    button { padding: .65rem 1rem; border: 0; border-radius: .5rem; background: #146245; color: white; font: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #3277b8; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <a href="../#/course/rover">返回小车课程</a>
    <h1>智能小车自动避障练习</h1>
    <p>根据测距读数和本题的示例规则，判断小车下一步怎么走。</p>
    <p id="progress"></p>
    <h2 id="question" tabindex="-1"></h2>
    <p id="rule"></p>
    <form id="exercise">
      <fieldset id="choices">
        <legend>选择小车的动作</legend>
        <label><input required type="radio" name="action" value="继续前进"> 继续前进</label>
        <label><input type="radio" name="action" value="转向绕行"> 转向绕行</label>
        <label><input type="radio" name="action" value="停止"> 停止</label>
      </fieldset>
      <button type="submit">提交答案</button>
    </form>
    <p id="feedback" role="status"></p>
    <button type="button" id="next" hidden>下一题</button>
  </main>
  <script>
    const questions = [
      { title: '前方距离 80 厘米', rule: '距离大于 50 厘米时继续前进。', answer: '继续前进', reason: '80 厘米大于本题的 50 厘米阈值。' },
      { title: '前方距离 30 厘米，旁侧可通行', rule: '距离为 50 厘米或以内，且旁侧可通行时，转向绕行。', answer: '转向绕行', reason: '30 厘米在示例阈值以内，且旁侧可以通行。' },
      { title: '传感器没有返回有效读数', rule: '测距读数无效时，先让小车停止。', answer: '停止', reason: '无法确认前方距离时，先让小车停下。' }
    ];

    const progress = document.querySelector('#progress');
    const question = document.querySelector('#question');
    const rule = document.querySelector('#rule');
    const form = document.querySelector('#exercise');
    const feedback = document.querySelector('#feedback');
    const next = document.querySelector('#next');
    let index = 0;
    let score = 0;

    function showQuestion() {
      progress.textContent = `第 ${index + 1} 题，共 ${questions.length} 题`;
      question.textContent = questions[index].title;
      rule.textContent = `本题示例规则：${questions[index].rule}`;
      feedback.textContent = '';
      form.reset();
      form.hidden = false;
      next.hidden = true;
      question.focus();
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const selected = new FormData(form).get('action');
      const { answer, reason } = questions[index];
      if (!selected) return;

      const correct = selected === answer;
      if (correct) score += 1;
      feedback.textContent = correct ? `答对了。${reason}` : `本题应选「${answer}」。${reason}`;
      form.hidden = true;
      next.textContent = index === questions.length - 1 ? '查看结果' : '下一题';
      next.hidden = false;
      next.focus();
    });

    next.addEventListener('click', () => {
      if (index === questions.length) {
        index = 0;
        score = 0;
        showQuestion();
        return;
      }

      index += 1;
      if (index < questions.length) {
        showQuestion();
        return;
      }

      progress.textContent = '练习完成';
      question.textContent = `答对 ${score} / ${questions.length} 题`;
      rule.textContent = '先读数据，再用规则判断动作。测距读数无效时先停止。';
      feedback.textContent = '';
      next.textContent = '再试一次';
      question.focus();
    });

    showQuestion();
  </script>
</body>
</html>
