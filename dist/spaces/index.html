<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#050505" />
<meta name="description" content="空间场景：门厅与两间实验室的三维展示。" />
<title>空间场景 · 一处门厅 · 两间实验室</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #050505;
    color: #f5f5f7;
    font-family: DengXian, 等线, system-ui, sans-serif;
    overflow: hidden;
  }
  #root { position: relative; width: 100%; height: 100%; }

  /* ---------- standalone back bar (hidden when embedded) ---------- */
  .spacesBack {
    position: absolute;
    z-index: 20;
    top: 20px;
    left: 24px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    min-height: 40px;
    padding: 8px 16px;
    border: 1px solid #ffffff2e;
    border-radius: 999px;
    background: #0c0c0ee6;
    color: #e9e9ee;
    font-size: 13px;
    line-height: 1.5;
    text-decoration: none;
    backdrop-filter: blur(8px);
  }
  .spacesBack:hover { background: #1b1b20; border-color: #ffffff55; }
  .spacesBack:focus-visible { outline: 2px solid #8cbfff; outline-offset: 3px; }
  .spacesBack[hidden] { display: none; }

  /* ---------- 3D showcase ---------- */
  .spaces {
    --px: 0;
    --py: 0;
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    isolation: isolate;
    perspective: 1400px;
    perspective-origin: 50% 50%;
  }
  .spacesLayers { position: absolute; inset: 0; overflow: hidden; transform-style: preserve-3d; }
  .spacesScene {
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transform-style: preserve-3d;
    transition: opacity .9s cubic-bezier(.4, 0, .2, 1), visibility 0s linear .9s;
  }
  .spacesScene[data-active="true"] {
    opacity: 1;
    visibility: visible;
    transition: opacity .9s cubic-bezier(.4, 0, .2, 1), visibility 0s;
  }
  .spacesTilt {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transform: rotateX(calc(var(--py) * -3.4deg)) rotateY(calc(var(--px) * 5.2deg));
    transition: transform .5s cubic-bezier(.22, .61, .36, 1);
  }
  .spacesOrbit {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    animation: spaces-orbit 26s ease-in-out infinite;
  }
  .spacesDepth { position: absolute; inset: 0; transform-style: preserve-3d; }
  .spacesCard {
    position: absolute;
    inset: 0;
    overflow: hidden;
    transform: translateZ(0) scale(1.08);
    backface-visibility: hidden;
    will-change: transform;
  }
  .spacesCard img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform: scale(1.02);
    transition: transform 1.4s cubic-bezier(.2, .7, .3, 1);
  }
  .spacesCardBack {
    position: absolute;
    inset: -3%;
    overflow: hidden;
    opacity: .55;
    transform: translateZ(-90px) scale(1.14);
    filter: blur(16px) saturate(1.15);
    backface-visibility: hidden;
    pointer-events: none;
  }
  .spacesCardBack img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .spacesScrim {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(180deg, #05050599 0%, #05050526 26%, #0505051a 52%, #050505d9 88%, #050505f2 100%);
  }
  .spacesOverlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 0 4.2% 8.5%;
    pointer-events: none;
    transform-style: preserve-3d;
    transform: translateZ(60px);
  }
  .spacesGhost {
    position: absolute;
    top: 50%;
    right: 6%;
    z-index: 1;
    font-size: clamp(200px, 32vw, 520px);
    font-weight: 800;
    line-height: .8;
    letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
    color: #ffffff0f;
    transform: translateY(-50%) translateZ(-40px);
    user-select: none;
    pointer-events: none;
  }
  .spacesEyebrow {
    display: block;
    margin: 0 0 18px;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.4;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #e8e8ec;
    text-shadow: 0 2px 14px #000a;
  }
  .spacesCopy { max-width: 26em; animation: spaces-rise .95s cubic-bezier(.16, .84, .32, 1) both; }
  .spacesCopy h2 {
    margin: 0 0 14px;
    font-size: clamp(38px, 4.6vw, 78px);
    font-weight: 600;
    line-height: 1.12;
    letter-spacing: -.02em;
    text-wrap: balance;
    color: #fff;
    text-shadow: 0 2px 26px #000c;
  }
  .spacesCopy p {
    margin: 0;
    font-size: clamp(15px, 1.15vw, 19px);
    line-height: 1.7;
    text-wrap: pretty;
    color: #e3e3e7;
    text-shadow: 0 2px 18px #000b;
  }
  .spacesCaption {
    display: block;
    margin: 26px 0 0;
    font-size: 12px;
    line-height: 1.6;
    color: #c3c3c8;
    text-shadow: 0 2px 14px #000a;
  }
  .spacesIndex {
    position: absolute;
    top: 0;
    right: clamp(20px, 3.4vw, 64px);
    bottom: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-end;
    gap: clamp(20px, 3.2vh, 38px);
    transform-style: preserve-3d;
    transform: translateZ(90px);
  }
  .spacesIndexItem {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    min-height: 44px;
    padding: 6px 0;
    border: 0;
    background: none;
    color: #a9a9b0;
    font: inherit;
    text-align: right;
    cursor: pointer;
    transition: color .3s, transform .45s cubic-bezier(.2, .8, .3, 1);
  }
  .spacesIndexItem:hover { color: #fff; transform: translateX(-6px); }
  .spacesIndexItem[aria-pressed="true"] { color: #fff; transform: translateX(-12px); }
  .spacesIndexItem:focus-visible { outline: 2px solid #8cbfff; outline-offset: 4px; border-radius: 2px; }
  .spacesIndexNum {
    display: block;
    font-size: clamp(20px, 1.7vw, 28px);
    font-weight: 600;
    line-height: 1;
    letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 14px #000a;
    transition: text-shadow .35s;
  }
  .spacesIndexItem[aria-pressed="true"] .spacesIndexNum { text-shadow: 0 0 26px #ffffff5c; }
  .spacesIndexLabel {
    display: block;
    white-space: nowrap;
    font-size: 12px;
    line-height: 1.4;
    text-shadow: 0 2px 14px #000a;
  }

  @keyframes spaces-orbit {
    0% { transform: rotateY(-4deg) rotateX(1.6deg) scale(1.035); }
    50% { transform: rotateY(4deg) rotateX(-1.4deg) scale(1.085); }
    100% { transform: rotateY(-4deg) rotateX(1.6deg) scale(1.035); }
  }
  @keyframes spaces-rise {
    0% { opacity: 0; transform: translateY(34px) rotateX(-9deg); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes spaces-fly {
    0% { opacity: 0; transform: translateZ(-340px) rotateY(26deg) scale(1.02); }
    18% { opacity: 1; }
    100% { opacity: 1; transform: none; }
  }
  .spacesScene[data-active="true"] .spacesDepth { animation: spaces-fly 1.25s cubic-bezier(.16, .84, .32, 1) both; }

  @media (width >= 1800px) {
    .spacesOverlay { padding-bottom: 9%; }
    .spacesCopy h2 { font-size: clamp(48px, 4.8vw, 84px); }
    .spacesCopy p { font-size: 20px; }
    .spacesIndexNum { font-size: 30px; }
    .spacesIndexLabel { font-size: 13px; }
    .spacesGhost { font-size: clamp(280px, 34vw, 600px); }
  }
  @media (width <= 1150px) {
    .spacesOverlay { padding: 0 5% 7%; }
    .spacesCopy h2 { font-size: clamp(34px, 4.4vw, 58px); }
    .spacesCopy p { font-size: 16px; }
    .spacesIndex { right: 24px; gap: 20px; }
    .spacesIndexLabel { font-size: 11px; }
    .spacesGhost { right: 4%; font-size: clamp(160px, 30vw, 320px); }
  }
  @media (height <= 680px) and (width >= 761px) {
    .spacesOverlay { padding-bottom: 5%; }
    .spacesCopy h2 { margin-bottom: 10px; font-size: clamp(30px, 3.8vw, 44px); }
    .spacesCopy p { font-size: 14px; }
    .spacesEyebrow { margin-bottom: 10px; font-size: 11px; }
    .spacesCaption { margin-top: 14px; font-size: 11px; }
    .spacesIndex { gap: 14px; }
    .spacesIndexNum { font-size: 20px; }
    .spacesGhost { font-size: clamp(140px, 26vw, 280px); }
  }
  @media (width <= 760px) {
    .spaces { perspective: 900px; }
    .spacesOverlay { padding: 0 6% 6%; }
    .spacesCopy { max-width: none; }
    .spacesCopy h2 { margin-bottom: 10px; font-size: 34px; }
    .spacesCopy p { font-size: 14px; }
    .spacesEyebrow { margin-bottom: 12px; font-size: 10px; }
    .spacesCaption { margin-top: 16px; font-size: 10px; }
    .spacesIndex { top: 96px; right: 16px; bottom: auto; gap: 12px; justify-content: flex-start; }
    .spacesIndexItem { min-height: 34px; gap: 8px; }
    .spacesIndexNum { font-size: 16px; }
    .spacesIndexLabel { font-size: 10px; }
    .spacesGhost { display: none; }
    .spacesBack { top: 12px; left: 14px; padding: 7px 13px; font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spacesTilt { transform: none !important; transition: none; }
    .spacesOrbit { animation: none; transform: scale(1.03); }
    .spacesDepth { animation: none !important; }
    .spacesCopy { animation: none; }
    .spacesScene { transition: opacity .01s; }
    .spacesCard img { transition: none; }
  }
</style>
</head>
<body>
<div id="root">
  <a class="spacesBack" id="spaces-back" href="../#/campus" hidden>← 返回校园</a>
  <section class="spaces" id="spaces" aria-label="门厅与两间实验室的空间场景"></section>
</div>
<script>
(() => {
  'use strict';

  const MEDIA_BASE = '/media/final-plan-20261113/';
  const TEXT_API = '/api/text-settings';
  const MEDIA_API = '/api/media-settings';

  const SCENES = [
    {
      key: 'foyer',
      slotId: 'campus.spaces.foyer',
      label: '门厅 · 迎宾与成果',
      title: '门厅与迎宾展示',
      body: '迎宾、导览与成果展示。',
      image: `${MEDIA_BASE}foyer-welcome.jpg`,
      alt: '最终方案图4-4，门厅迎宾形象墙与两室导览',
      position: 'center 28%',
      num: '01'
    },
    {
      key: 'production',
      slotId: 'campus.spaces.production',
      label: 'AI＋生产',
      title: 'AI＋生产实验室',
      body: '四个功能区协同，完成设计—制作—验证的完整链路。',
      image: `${MEDIA_BASE}production-main.jpg`,
      alt: '最终方案图4-1，AI＋生产实验室大屏、协作工位与制造设备主视角',
      position: 'center 32%',
      num: '02'
    },
    {
      key: 'life',
      slotId: 'campus.spaces.life',
      label: 'AI＋生活',
      title: 'AI＋生活实验室',
      body: '三个功能区，让身边物品回应一次有依据的操作。',
      image: `${MEDIA_BASE}life-main.jpg`,
      alt: '最终方案图4-2，AI＋生活实验室中心互动台、周边体验区与教学屏幕',
      position: 'center 30%',
      num: '03'
    }
  ];

  const DEFAULTS = {
    heading: '一处门厅 · 两间实验室',
    footnote: '参观路线：门厅 → AI＋生产 → AI＋生活'
  };

  const state = {
    index: 0,
    text: { heading: DEFAULTS.heading, footnote: DEFAULTS.footnote },
    media: {}
  };

  const root = document.getElementById('root');
  const stage = document.getElementById('spaces');
  const back = document.getElementById('spaces-back');
  const embedded = window.self !== window.top;

  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const sceneNodes = [];
  let copyNode = null;
  let ghostNode = null;
  let eyebrowNode = null;
  let captionNode = null;
  const indexButtons = [];

  // ---- build the static skeleton -------------------------------------
  const layers = el('div', 'spacesLayers');
  for (const scene of SCENES) {
    const sceneNode = el('div', 'spacesScene');
    sceneNode.dataset.active = 'false';
    sceneNode.dataset.sceneLayer = String(SCENES.indexOf(scene));

    const tilt = el('div', 'spacesTilt');
    const orbit = el('div', 'spacesOrbit');
    const depth = el('div', 'spacesDepth');

    const backCard = el('div', 'spacesCardBack');
    const backImage = document.createElement('img');
    backImage.alt = '';
    backImage.decoding = 'async';
    backImage.src = scene.image;
    backImage.style.objectFit = 'cover';
    backImage.style.objectPosition = scene.position;
    backCard.appendChild(backImage);

    const card = el('div', 'spacesCard');
    const image = document.createElement('img');
    image.alt = scene.alt;
    image.decoding = 'async';
    image.src = scene.image;
    image.style.objectFit = 'cover';
    image.style.objectPosition = scene.position;
    card.appendChild(image);

    depth.append(backCard, card);
    orbit.appendChild(depth);
    tilt.appendChild(orbit);
    sceneNode.appendChild(tilt);
    layers.appendChild(sceneNode);
    sceneNodes.push({ sceneNode, backImage, image });
  }

  ghostNode = el('div', 'spacesGhost');
  ghostNode.setAttribute('aria-hidden', 'true');

  const scrim = el('div', 'spacesScrim');
  scrim.setAttribute('aria-hidden', 'true');

  const overlay = el('div', 'spacesOverlay');
  eyebrowNode = el('p', 'spacesEyebrow', state.text.heading);
  copyNode = el('div', 'spacesCopy');
  const copyTitle = el('h2');
  const copyBody = el('p');
  copyNode.append(copyTitle, copyBody);
  captionNode = el('p', 'spacesCaption', state.text.footnote);
  overlay.append(eyebrowNode, copyNode, captionNode);

  const index = el('div', 'spacesIndex');
  index.setAttribute('role', 'group');
  index.setAttribute('aria-label', '选择空间场景');
  for (const scene of SCENES) {
    const button = el('button', 'spacesIndexItem');
    button.type = 'button';
    button.setAttribute('aria-pressed', 'false');
    const num = el('span', 'spacesIndexNum', scene.num);
    const label = el('span', 'spacesIndexLabel', scene.label);
    button.append(num, label);
    button.addEventListener('click', () => setIndex(SCENES.indexOf(scene)));
    index.appendChild(button);
    indexButtons.push(button);
  }

  stage.append(layers, ghostNode, scrim, overlay, index);

  // ---- rendering ------------------------------------------------------
  function setIndex(next) {
    const total = SCENES.length;
    state.index = ((next % total) + total) % total;
    const current = SCENES[state.index];
    sceneNodes.forEach((entry, i) => {
      entry.sceneNode.dataset.active = i === state.index ? 'true' : 'false';
    });
    indexButtons.forEach((button, i) => {
      button.setAttribute('aria-pressed', i === state.index ? 'true' : 'false');
    });
    ghostNode.textContent = current.num;
    copyTitle.textContent = state.text[`${current.key}.title`] ?? current.title;
    copyBody.textContent = state.text[`${current.key}.body`] ?? current.body;
    const label = state.text[`${current.key}.label`] ?? current.label;
    const labelNode = indexButtons[state.index].querySelector('.spacesIndexLabel');
    if (labelNode) labelNode.textContent = label;
    copyNode.style.animation = 'none';
    void copyNode.offsetWidth;
    copyNode.style.animation = '';
  }

  function applyText(values) {
    if (!values || typeof values !== 'object') return;
    if (typeof values['heading.1'] === 'string') {
      state.text.heading = values['heading.1'];
      eyebrowNode.textContent = state.text.heading;
    }
    if (typeof values.footnote === 'string') {
      state.text.footnote = values.footnote;
      captionNode.textContent = state.text.footnote;
    }
    for (const scene of SCENES) {
      for (const part of ['title', 'body', 'label']) {
        const field = `${scene.key}.${part}`;
        if (typeof values[field] === 'string') state.text[field] = values[field];
      }
    }
    setIndex(state.index);
  }

  function applyMedia(overrides) {
    if (!overrides || typeof overrides !== 'object') return;
    for (const scene of SCENES) {
      const override = overrides[scene.slotId];
      if (!override || typeof override.url !== 'string') continue;
      const fit = override.fit === 'contain' ? 'contain' : 'cover';
      for (const image of [sceneNodes[SCENES.indexOf(scene)].image, sceneNodes[SCENES.indexOf(scene)].backImage]) {
        image.src = override.url;
        image.style.objectFit = fit;
        image.style.objectPosition = override.position || scene.position;
      }
    }
  }

  async function loadJson(url) {
    try {
      const response = await fetch(url, { credentials: 'same-origin', cache: 'no-store' });
      if (!response.ok) return null;
      return await response.json();
    } catch { return null; }
  }

  async function loadOverrides() {
    const [text, media] = await Promise.all([loadJson(TEXT_API), loadJson(MEDIA_API)]);
    if (text && text.overrides && text.overrides['campus.spaces']) {
      applyText(text.overrides['campus.spaces'].values || {});
    }
    if (media && media.overrides) {
      const picked = {};
      for (const scene of SCENES) {
        if (media.overrides[scene.slotId]) picked[scene.slotId] = media.overrides[scene.slotId];
      }
      applyMedia(picked);
    }
  }

  // ---- pointer parallax (rAF, no re-render) ---------------------------
  const target = { x: 0, y: 0 };
  const current = { x: 0, y: 0 };
  let frame = 0;
  let running = false;
  function run() {
    current.x += (target.x - current.x) * .09;
    current.y += (target.y - current.y) * .09;
    stage.style.setProperty('--px', current.x.toFixed(4));
    stage.style.setProperty('--py', current.y.toFixed(4));
    if (Math.abs(target.x - current.x) > .001 || Math.abs(target.y - current.y) > .001
      || Math.abs(current.x) > .001 || Math.abs(current.y) > .001) {
      frame = requestAnimationFrame(run);
    } else {
      running = false;
      frame = 0;
    }
  }
  function kick() {
    if (!running) { running = true; frame = requestAnimationFrame(run); }
  }
  stage.addEventListener('pointermove', (event) => {
    const rect = stage.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    target.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    target.y = ((event.clientY - rect.top) / rect.height) * 2 - 1;
    kick();
  });
  stage.addEventListener('pointerleave', () => { target.x = 0; target.y = 0; kick(); });

  // ---- autonomous auto-advance (5s) ----------------------------------
  const INTERVAL = 5000;
  let timer = 0;
  let focused = false;
  let visible = true;

  function startTimer() {
    stopTimer();
    timer = window.setInterval(() => {
      if (document.hidden || focused || !visible) return;
      setIndex(state.index + 1);
    }, INTERVAL);
  }
  function stopTimer() {
    if (timer) { window.clearInterval(timer); timer = 0; }
  }

  stage.addEventListener('focusin', () => { focused = true; });
  stage.addEventListener('focusout', (event) => {
    if (event.relatedTarget && stage.contains(event.relatedTarget)) return;
    focused = false;
  });

  const reduced = typeof matchMedia === 'function'
    && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- back link (standalone only) -----------------------------------
  if (!embedded) {
    back.hidden = false;
    back.addEventListener('click', (event) => {
      try {
        if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
          event.preventDefault();
          history.back();
        }
      } catch { /* fall back to the plain link */ }
    });
  }

  // ---- mouse wheel / swipe scene switching ---------------------------
  // The wheel event inside an iframe never reaches the parent document, so
  // the standalone page reacts on its own: scrolling cycles the three scenes.
  // At the first or last scene the intent is forwarded to the campus deck so
  // the visitor can keep scrolling straight into the next page.
  let wheelLock = 0;
  function forwardStep(direction) {
    if (!embedded) return;
    try {
      window.parent.postMessage({ type: 'jingshan:spaces-step', direction }, location.origin);
    } catch { /* the parent may be gone */ }
  }
  function step(direction) {
    const next = state.index + direction;
    if (next < 0) { forwardStep(-1); return; }
    if (next >= SCENES.length) { forwardStep(1); return; }
    setIndex(next);
  }
  function onWheel(event) {
    if (event.target.closest('.spacesIndex, .spacesBack')) return;
    const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
    if (Math.abs(delta) < 18) return;
    const now = performance.now();
    if (now - wheelLock < 620) return;
    wheelLock = now;
    event.preventDefault();
    step(delta > 0 ? 1 : -1);
  }
  stage.addEventListener('wheel', onWheel, { passive: false });

  // ---- touch swipe ---------------------------------------------------
  let touchStart = null;
  stage.addEventListener('touchstart', (event) => {
    if (event.touches.length !== 1) { touchStart = null; return; }
    touchStart = { x: event.touches[0].clientX, y: event.touches[0].clientY };
  }, { passive: true });
  stage.addEventListener('touchmove', (event) => {
    if (!touchStart || event.touches.length !== 1) return;
    const dx = event.touches[0].clientX - touchStart.x;
    const dy = event.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    touchStart = null;
    step(dx < 0 ? 1 : -1);
  }, { passive: true });
  stage.addEventListener('touchend', () => { touchStart = null; }, { passive: true });
  stage.addEventListener('touchcancel', () => { touchStart = null; }, { passive: true });

  // ---- mouse drag / swipe --------------------------------------------
  // Pointer events inside an iframe never reach the parent document, so the
  // deck's own drag detector cannot see a drag that starts here. The gesture
  // is mirrored locally with the same thresholds the deck uses.
  let dragStart = null;
  stage.addEventListener('pointerdown', (event) => {
    if (event.pointerType !== 'mouse' || event.button !== 0) { dragStart = null; return; }
    if (event.target.closest('.spacesIndex, .spacesBack')) { dragStart = null; return; }
    dragStart = { x: event.clientX, y: event.clientY };
  });
  stage.addEventListener('pointerup', (event) => {
    const start = dragStart;
    dragStart = null;
    if (!start) return;
    const dx = event.clientX - start.x;
    const dy = event.clientY - start.y;
    if (Math.abs(dx) < 90 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
    step(dx < 0 ? 1 : -1);
  });
  stage.addEventListener('pointercancel', () => { dragStart = null; });

  // ---- embedding bridge ----------------------------------------------
  // When this page is embedded in the campus deck, the parent drives the
  // scene index and the visibility state through postMessage.
  if (embedded) {
    window.addEventListener('message', (event) => {
      if (event.origin !== location.origin) return;
      const data = event.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'jingshan:spaces-index' && Number.isInteger(data.index)) {
        setIndex(data.index);
      }
      if (data.type === 'jingshan:spaces-visible') {
        visible = data.visible !== false;
      }
    });
    // Arrow keys inside the frame should still move the parent deck.
    window.addEventListener('keydown', (event) => {
      if (!['ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown'].includes(event.key)) return;
      event.preventDefault();
      const direction = event.key === 'ArrowRight' || event.key === 'PageDown' ? 1 : -1;
      forwardStep(direction);
    });
    const report = () => {
      try {
        window.parent.postMessage({ type: 'jingshan:spaces-ready', index: state.index }, location.origin);
      } catch { /* the parent may be gone */ }
    };
    if (document.readyState === 'complete') report();
    else window.addEventListener('load', report, { once: true });
  }

  setIndex(0);
  loadOverrides();
  if (!reduced) startTimer();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopTimer();
    else if (!reduced) startTimer();
  });
})();
</script>
</body>
</html>
